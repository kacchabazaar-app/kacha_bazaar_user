<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="utf-8" />
          <link rel="icon" href="%PUBLIC_URL%/logoo 192.png" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
                  <meta name="theme-color" content="#020617" />
                      <meta name="description" content="Order fresh groceries and daily essentials with Kacha Bazaar for quick doorstep delivery!" />

                          <!-- 🟢 ১. ক্যাশিং পুরোপুরি বন্ধ করার কঠোর মেটা ট্যাগ -->
                              <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
                                  <meta http-equiv="Pragma" content="no-cache" />
                                      <meta http-equiv="Expires" content="0" />

                                          <link rel="apple-touch-icon" href="%PUBLIC_URL%/logoo 192.png" />
                                              <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
                                                  <title>Kacha Bazaar</title>

                                                      <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

                                                          <!-- 🟢 ২. সার্ভিস ওয়ার্কার আনরেজিস্টার এবং ক্লিয়ার করার স্ক্রিপ্ট -->
                                                              <script>
                                                                    if ('serviceWorker' in navigator) {
                                                                            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                                                                                      for(let registration of registrations) {
                                                                                                  registration.unregister();
                                                                                                            }
                                                                                                                    });
                                                                                                                          }
                                                                                                                                if ('caches' in window) {
                                                                                                                                        caches.keys().then(function(names) {
                                                                                                                                                  for (let name of names) {
                                                                                                                                                              caches.delete(name);
                                                                                                                                                                        }
                                                                                                                                                                                });
                                                                                                                                                                                      }
                                                                                                                                                                                          </script>
                                                                                                                                                                                            </head>
                                                                                                                                                                                              <body>
                                                                                                                                                                                                  <noscript>You need to enable JavaScript to run this app.</noscript>
                                                                                                                                                                                                      <div id="root"></div>

                                                                                                                                                                                                          <!-- Firebase App এবং Messaging SDK -->
                                                                                                                                                                                                              <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
                                                                                                                                                                                                                  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>

                                                                                                                                                                                                                      <script>
                                                                                                                                                                                                                            const firebaseConfig = {
                                                                                                                                                                                                                                    apiKey: 
                                                                                                                                                                                                                                            authDomain:
                                                                                                                                                                                                                                                    projectId: 
                                                                                                                                                                                                                                                            storageBucket: 
                                                                                                                                                                                                                                                                    messagingSenderId: 
                                                                                                                                                                                                                                                                            appId: 
                                                                                                                                                                                                                                                                                  };

                                                                                                                                                                                                                                                                                        firebase.initializeApp(firebaseConfig);
                                                                                                                                                                                                                                                                                              const messaging = firebase.messaging();

                                                                                                                                                                                                                                                                                                    function requestNotificationPermission() {
                                                                                                                                                                                                                                                                                                            console.log('পারমিশন চাওয়া হচ্ছে...');
                                                                                                                                                                                                                                                                                                                    Notification.requestPermission().then((permission) => {
                                                                                                                                                                                                                                                                                                                              if (permission === 'granted') {
                                                                                                                                                                                                                                                                                                                                          console.log('নোটিফিকেশন পারমিশন পাওয়া গেছে।');
                                                                                                                                                                                                                                                                                                                                                      messaging.getToken({ vapidKey:  })
                                                                                                                                                                                                                                                                                                                                                                    .then((currentToken) => {
                                                                                                                                                                                                                                                                                                                                                                                    if (currentToken) {
                                                                                                                                                                                                                                                                                                                                                                                                      console.log('আপনার FCM Token:', currentToken);
                                                                                                                                                                                                                                                                                                                                                                                                                      } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                        console.log('কোনো রেজিস্ট্রেশন টোকেন পাওয়া যায়নি। পারমিশন দিন।');
                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }).catch((err) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      console.log('টোকেন নেওয়ার সময় ভুল হয়েছে: ', err);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          console.log('ইউজার নোটিফিকেশন পারমিশন দেননি।');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        window.addEventListener('load', function() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                requestNotificationPermission();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            messaging.onMessage((payload) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    console.log('ফোরগ্রাউন্ড মেসেজ:', payload);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            alert(`${payload.notification.title}: ${payload.notification.body}`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
